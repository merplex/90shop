<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการยอดเงิน</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; min-height: 100vh; padding: 16px; }

    .top-bar { background: #FB8C00; color: #fff; padding: 14px 16px; font-size: 17px; font-weight: bold; border-radius: 12px; margin-bottom: 16px; }

    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .card h3 { font-size: 14px; color: #555; margin-bottom: 12px; }

    #scan-btn {
      width: 100%; padding: 14px; background: #FB8C00; color: #fff;
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    }

    .machine-box { display: none; align-items: center; justify-content: space-between; gap: 10px; }
    .machine-box.show { display: flex; }
    .machine-info { font-size: 15px; color: #333; }
    .machine-info b { color: #FB8C00; font-size: 18px; }
    .machine-sub { font-size: 12px; color: #999; margin-top: 2px; }
    .rescan-btn { padding: 8px 14px; background: #f0f0f0; border: none; border-radius: 8px; font-size: 13px; color: #555; cursor: pointer; white-space: nowrap; }

    .amount-section { display: none; }
    .amount-section.show { display: block; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 18px; text-align: right; margin-bottom: 0;
    }

    #confirm-btn {
      width: 100%; padding: 14px; background: #FB8C00; color: #fff;
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    #confirm-btn:disabled { background: #aaa; }

    #msg { margin-top: 12px; text-align: center; font-size: 14px; color: #555; min-height: 18px; }
  </style>
</head>
<body>
  <div class="top-bar">💰 จัดการยอดเงิน</div>

  <div class="card">
    <h3>เครื่อง</h3>
    <button id="scan-btn">📷 สแกน QR เครื่อง</button>
    <div class="machine-box" id="machine-box">
      <div class="machine-info">
        สาขา: <b id="machine-branch"></b> เครื่อง: <b id="machine-number"></b>
        <div class="machine-sub" id="machine-id-full"></div>
      </div>
      <button class="rescan-btn" id="rescan-btn">สแกนใหม่</button>
    </div>
  </div>

  <div class="card amount-section" id="amount-section">
    <h3>จำนวนแต้ม (บาท) ที่ต้องการส่งไปที่เครื่อง</h3>
    <input id="amount-input" type="number" min="1" step="1" placeholder="0" inputmode="numeric" />
  </div>

  <button id="confirm-btn" disabled>สแกน QR เครื่องก่อน</button>
  <div id="msg"></div>

  <script>
    let currentMachine = null; // { machine_id, branch_id, branch_name }

    async function init() {
      await liff.init({ liffId: '2009523613-hLnRGrZC' });
      if (!liff.isLoggedIn()) { liff.login(); return; }
    }

    function stripBranchPrefix(machineId, branchName) {
      const prefix = branchName + '_';
      if (machineId.startsWith(prefix)) return machineId.slice(prefix.length);
      const idx = machineId.lastIndexOf('_');
      return idx > 0 ? machineId.slice(idx + 1) : machineId;
    }

    async function scanMachine() {
      document.getElementById('msg').textContent = '';
      let scanned;
      try {
        scanned = await liff.scanCodeV2();
      } catch (e) {
        document.getElementById('msg').textContent = 'เปิดกล้องสแกนไม่ได้ กรุณาเปิดผ่านแอป LINE';
        return;
      }
      const machineId = (scanned && scanned.value || '').trim();
      if (!machineId) {
        document.getElementById('msg').textContent = 'ยกเลิกการสแกน';
        return;
      }

      document.getElementById('msg').textContent = 'กำลังตรวจสอบเครื่อง...';
      try {
        const res = await fetch(`/api/machine-info/${encodeURIComponent(machineId)}`);
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('msg').textContent = data.message || 'ไม่พบข้อมูลเครื่องนี้';
          return;
        }
        currentMachine = data;
        showMachine();
        document.getElementById('msg').textContent = '';
      } catch (e) {
        document.getElementById('msg').textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
      }
    }

    function showMachine() {
      document.getElementById('machine-branch').textContent = currentMachine.branch_name;
      document.getElementById('machine-number').textContent = stripBranchPrefix(currentMachine.machine_id, currentMachine.branch_name);
      document.getElementById('machine-id-full').textContent = currentMachine.machine_id;
      document.getElementById('scan-btn').style.display = 'none';
      document.getElementById('machine-box').classList.add('show');
      document.getElementById('amount-section').classList.add('show');
      updateConfirmState();
    }

    document.getElementById('rescan-btn').addEventListener('click', () => {
      currentMachine = null;
      document.getElementById('scan-btn').style.display = 'block';
      document.getElementById('machine-box').classList.remove('show');
      document.getElementById('amount-section').classList.remove('show');
      document.getElementById('amount-input').value = '';
      updateConfirmState();
    });

    document.getElementById('scan-btn').addEventListener('click', scanMachine);
    document.getElementById('amount-input').addEventListener('input', updateConfirmState);

    function updateConfirmState() {
      const amount = parseInt(document.getElementById('amount-input').value, 10);
      const btn = document.getElementById('confirm-btn');

      if (!currentMachine) {
        btn.disabled = true;
        btn.textContent = 'สแกน QR เครื่องก่อน';
        return;
      }
      if (!amount || amount <= 0) {
        btn.disabled = true;
        btn.textContent = 'กรอกจำนวนเงิน';
        return;
      }
      btn.disabled = false;
      btn.textContent = `ยืนยันส่ง ฿${amount.toLocaleString()} ไปยังเครื่อง ${stripBranchPrefix(currentMachine.machine_id, currentMachine.branch_name)}`;
    }

    document.getElementById('confirm-btn').addEventListener('click', async () => {
      const amount = parseInt(document.getElementById('amount-input').value, 10);
      if (!currentMachine || !amount || amount <= 0) return;

      const btn = document.getElementById('confirm-btn');
      btn.disabled = true;
      btn.textContent = 'กำลังส่ง...';

      try {
        const profile = await liff.getProfile().catch(() => null);
        const res = await fetch('/api/balance/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            machineId: currentMachine.machine_id,
            branchId: currentMachine.branch_id,
            amount,
            requestedBy: profile ? profile.userId : null
          })
        });
        const data = await res.json();
        document.getElementById('msg').textContent = data.message || 'ส่งคำสั่งสำเร็จ';
        document.getElementById('amount-input').value = '';
      } catch (e) {
        document.getElementById('msg').textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
      }
      updateConfirmState();
    });

    init();
  </script>
</body>
</html>
