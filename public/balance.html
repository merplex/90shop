<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการยอดเงิน</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f0f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .top-bar { background: #FB8C00; color: #fff; padding: 14px 16px; font-size: 17px; font-weight: bold; flex-shrink: 0; }

    .panels { display: flex; flex: 1; overflow: hidden; gap: 1px; background: #ddd; }

    .panel { background: #fff; display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .panel-title { padding: 10px 12px; font-size: 13px; font-weight: bold; color: #555; background: #f9f9f9; border-bottom: 1px solid #eee; flex-shrink: 0; }

    .list { flex: 1; overflow-y: auto; }

    .branch-item {
      padding: 12px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
      font-size: 14px; color: #333;
    }
    .branch-item.active { background: #fff3e0; color: #FB8C00; font-weight: bold; border-left: 3px solid #FB8C00; }
    .branch-item:hover { background: #f5f5f5; }

    .machine-item {
      padding: 11px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
      font-size: 14px; color: #333;
    }
    .machine-item.active { background: #fff3e0; color: #FB8C00; font-weight: bold; border-left: 3px solid #FB8C00; }
    .machine-item:hover { background: #f5f5f5; }
    .machine-empty, .branch-empty { padding: 20px; text-align: center; color: #aaa; font-size: 13px; }

    .footer { background: #fff; border-top: 1px solid #ddd; padding: 12px 16px; flex-shrink: 0; }
    .amount-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .amount-row label { font-size: 13px; color: #555; white-space: nowrap; }
    .amount-row input {
      flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 15px; text-align: right;
    }
    .summary { font-size: 13px; color: #555; margin-bottom: 8px; min-height: 18px; }

    #confirm-btn {
      width: 100%; padding: 13px; background: #FB8C00; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    #confirm-btn:disabled { background: #aaa; }

    .loading { padding: 30px; text-align: center; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <div class="top-bar">จัดการยอดเงิน</div>

  <div class="panels">
    <div class="panel">
      <div class="panel-title">สาขา</div>
      <div class="list" id="branch-list"><div class="loading">กำลังโหลด...</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">เครื่อง</div>
      <div class="list" id="machine-list"><div class="machine-empty">เลือกสาขาก่อน</div></div>
    </div>
  </div>

  <div class="footer">
    <div class="amount-row">
      <label for="amount-input">จำนวนเงิน</label>
      <input id="amount-input" type="number" min="1" step="1" placeholder="0" inputmode="numeric" />
    </div>
    <div class="summary" id="summary"></div>
    <button id="confirm-btn" disabled>เลือกสาขาและเครื่องก่อน</button>
  </div>

  <script>
    let branches = [];
    let machineIds = [];
    let selectedBranch = null;
    let selectedMachineId = null;

    async function init() {
      await liff.init({ liffId: '2009523613-hLnRGrZC' });
      if (!liff.isLoggedIn()) { liff.login(); return; }

      branches = await fetch('/api/branches').then(r => r.json());
      renderBranches();
    }

    function renderBranches() {
      const el = document.getElementById('branch-list');
      if (branches.length === 0) { el.innerHTML = '<div class="branch-empty">ไม่มีข้อมูลสาขา</div>'; return; }
      el.innerHTML = branches.map(b => `
        <div class="branch-item${selectedBranch && selectedBranch.id === b.id ? ' active' : ''}"
             onclick="selectBranch(${b.id}, '${b.branch_name.replace(/'/g, "\\'")}')">
          ${b.branch_name}
        </div>
      `).join('');
    }

    async function selectBranch(id, name) {
      selectedBranch = { id, branch_name: name };
      selectedMachineId = null;
      renderBranches();
      updateConfirmState();

      document.getElementById('machine-list').innerHTML = '<div class="loading">กำลังโหลด...</div>';

      machineIds = await fetch(`/api/machines/${id}`).then(r => r.json());
      renderMachines();
    }

    function stripBranchPrefix(machineId) {
      const prefix = selectedBranch.branch_name + '_';
      if (machineId.startsWith(prefix)) return machineId.slice(prefix.length);
      const idx = machineId.lastIndexOf('_');
      return idx > 0 ? machineId.slice(idx + 1) : machineId;
    }

    function renderMachines() {
      const el = document.getElementById('machine-list');
      if (machineIds.length === 0) { el.innerHTML = '<div class="machine-empty">ไม่พบเครื่องในสาขานี้</div>'; return; }
      el.innerHTML = machineIds.map(mId => `
        <div class="machine-item${selectedMachineId === mId ? ' active' : ''}"
             onclick="selectMachine('${mId}')">
          ${stripBranchPrefix(mId)}
        </div>
      `).join('');
    }

    function selectMachine(mId) {
      selectedMachineId = mId;
      renderMachines();
      updateConfirmState();
    }

    document.getElementById('amount-input').addEventListener('input', updateConfirmState);

    function updateConfirmState() {
      const amount = parseInt(document.getElementById('amount-input').value, 10);
      const btn = document.getElementById('confirm-btn');
      const summaryEl = document.getElementById('summary');

      if (!selectedBranch || !selectedMachineId) {
        btn.disabled = true;
        btn.textContent = 'เลือกสาขาและเครื่องก่อน';
        summaryEl.textContent = '';
        return;
      }
      const machineLabel = stripBranchPrefix(selectedMachineId);
      if (!amount || amount <= 0) {
        btn.disabled = true;
        btn.textContent = 'กรอกจำนวนเงิน';
        summaryEl.textContent = `เครื่อง: ${selectedBranch.branch_name} ${machineLabel}`;
        return;
      }
      btn.disabled = false;
      btn.textContent = `ยืนยันส่ง ฿${amount.toLocaleString()} ไปยังเครื่อง ${machineLabel}`;
      summaryEl.textContent = `เครื่อง: ${selectedBranch.branch_name} ${machineLabel}`;
    }

    document.getElementById('confirm-btn').addEventListener('click', async () => {
      const amount = parseInt(document.getElementById('amount-input').value, 10);
      if (!selectedBranch || !selectedMachineId || !amount || amount <= 0) return;

      const btn = document.getElementById('confirm-btn');
      btn.disabled = true;
      btn.textContent = 'กำลังส่ง...';

      try {
        const profile = await liff.getProfile().catch(() => null);
        const res = await fetch('/api/balance/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            machineId: selectedMachineId,
            branchId: selectedBranch.id,
            amount,
            requestedBy: profile ? profile.userId : null
          })
        });
        const data = await res.json();
        document.getElementById('summary').textContent = data.message || 'ส่งคำสั่งสำเร็จ';
        document.getElementById('amount-input').value = '';
      } catch (e) {
        document.getElementById('summary').textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
      }
      updateConfirmState();
    });

    init();
  </script>
</body>
</html>
