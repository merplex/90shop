<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายงานต่อเครื่อง</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f0f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .top-bar { background: #FF1493; color: #fff; padding: 12px 16px; flex-shrink: 0; }
    .top-bar .title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
    .periods { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
      background: rgba(255,255,255,.25); color: #fff; border: 1px solid transparent;
    }
    .chip.active { background: #fff; color: #FF1493; font-weight: bold; }
    .range-row { display: none; gap: 6px; margin-top: 8px; align-items: center; }
    .range-row.show { display: flex; }
    .range-row input { flex: 1; padding: 6px 8px; border-radius: 6px; border: none; font-size: 13px; }
    .range-row span { color: #fff; font-size: 13px; }

    .panels { display: flex; flex: 1; overflow: hidden; gap: 1px; background: #ddd; }
    .panel { background: #fff; display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .panel-title { padding: 10px 12px; font-size: 13px; font-weight: bold; color: #555; background: #f9f9f9; border-bottom: 1px solid #eee; flex-shrink: 0; }
    .list { flex: 1; overflow-y: auto; }

    .branch-item { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 14px; color: #333; display: flex; justify-content: space-between; align-items: center; }
    .branch-item.active { background: #ffeef6; color: #FF1493; font-weight: bold; border-left: 3px solid #FF1493; }
    .branch-item .badge { background: #FF1493; color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 7px; }

    .machine-item { padding: 11px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 14px; color: #333; display: flex; align-items: center; gap: 10px; }
    .machine-item .box { width: 18px; height: 18px; border: 2px solid #bbb; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; }
    .machine-item.checked .box { background: #FF1493; border-color: #FF1493; }
    .machine-item.checked { color: #FF1493; font-weight: bold; }
    .machine-empty, .branch-empty { padding: 20px; text-align: center; color: #aaa; font-size: 13px; }

    .footer { background: #fff; border-top: 1px solid #ddd; padding: 12px 16px; flex-shrink: 0; }
    .summary { font-size: 13px; color: #555; margin-bottom: 8px; min-height: 18px; }
    #show-btn { width: 100%; padding: 13px; background: #FF1493; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    #show-btn:disabled { background: #aaa; }
    .loading { padding: 30px; text-align: center; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="title">รายงานต่อเครื่อง</div>
    <div class="periods" id="periods">
      <div class="chip active" data-period="today">วันนี้</div>
      <div class="chip" data-period="week">สัปดาห์นี้</div>
      <div class="chip" data-period="month">เดือนนี้</div>
      <div class="chip" data-period="custom">เลือกช่วงเอง</div>
    </div>
    <div class="range-row" id="range-row">
      <input type="date" id="date-start" />
      <span>–</span>
      <input type="date" id="date-end" />
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-title">สาขา (เลือกได้หลายสาขา)</div>
      <div class="list" id="branch-list"><div class="loading">กำลังโหลด...</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">เครื่อง (เลือกได้หลายเครื่อง)</div>
      <div class="list" id="machine-list"><div class="machine-empty">เลือกสาขาก่อน</div></div>
    </div>
  </div>

  <div class="footer">
    <div class="summary" id="summary">ยังไม่ได้เลือกเครื่อง</div>
    <button id="show-btn" disabled>เลือกเครื่องก่อน</button>
  </div>

  <script>
    let branches = [];
    let machineIds = [];            // เครื่องของสาขาที่กำลังเปิดอยู่
    let selectedBranch = null;
    let period = 'today';
    const selected = new Set();     // machine_id ที่เลือกทั้งหมด (ข้ามสาขาได้ ไม่ล้างเมื่อสลับสาขา)
    const machineBranch = {};       // machine_id -> ชื่อสาขา (ไว้โชว์)

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    async function init() {
      await liff.init({ liffId: '2009523613-hLnRGrZC' });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const today = new Date(Date.now() + 7 * 3600 * 1000).toISOString().slice(0, 10);
      document.getElementById('date-start').value = today;
      document.getElementById('date-end').value = today;
      try {
        const res = await fetch('/api/my-branches', { headers: { Authorization: `Bearer ${liff.getAccessToken()}` } });
        const data = await res.json();
        if (!res.ok) { document.getElementById('branch-list').innerHTML = `<div class="branch-empty">${esc(data.message || 'โหลดสาขาไม่สำเร็จ')}</div>`; return; }
        branches = data;
      } catch (e) {
        document.getElementById('branch-list').innerHTML = '<div class="branch-empty">โหลดสาขาไม่สำเร็จ กรุณาลองใหม่</div>'; return;
      }
      renderBranches();
    }

    // ----- ช่วงเวลา -----
    document.getElementById('periods').addEventListener('click', e => {
      const chip = e.target.closest('.chip'); if (!chip) return;
      period = chip.dataset.period;
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
      document.getElementById('range-row').classList.toggle('show', period === 'custom');
    });

    // ----- สาขา -----
    function branchSelectedCount(name) {
      let n = 0; selected.forEach(id => { if (machineBranch[id] === name) n++; }); return n;
    }
    function renderBranches() {
      const el = document.getElementById('branch-list');
      if (!branches.length) { el.innerHTML = '<div class="branch-empty">ไม่มีข้อมูลสาขา</div>'; return; }
      el.innerHTML = branches.map(b => {
        const n = branchSelectedCount(b.branch_name);
        return `<div class="branch-item${selectedBranch && selectedBranch.id === b.id ? ' active' : ''}" data-id="${b.id}" data-name="${esc(b.branch_name)}">
          <span>${esc(b.branch_name)}</span>${n ? `<span class="badge">${n}</span>` : ''}</div>`;
      }).join('');
    }
    document.getElementById('branch-list').addEventListener('click', e => {
      const item = e.target.closest('.branch-item'); if (!item) return;
      selectBranch(item.dataset.id, item.dataset.name);
    });
    async function selectBranch(id, name) {
      selectedBranch = { id, branch_name: name };
      renderBranches();
      document.getElementById('machine-list').innerHTML = '<div class="loading">กำลังโหลด...</div>';
      try {
        const res = await fetch(`/api/machines/${id}`);
        const data = await res.json();
        if (!res.ok) throw new Error();
        machineIds = data;
        machineIds.forEach(mId => { machineBranch[mId] = name; });
        renderMachines();
      } catch (e) {
        document.getElementById('machine-list').innerHTML = '<div class="machine-empty">โหลดรายการเครื่องไม่สำเร็จ</div>';
      }
    }

    // ----- เครื่อง -----
    function stripPrefix(mId) {
      const p = (selectedBranch.branch_name + '_');
      if (mId.startsWith(p)) return mId.slice(p.length);
      const i = mId.lastIndexOf('_'); return i > 0 ? mId.slice(i + 1) : mId;
    }
    function renderMachines() {
      const el = document.getElementById('machine-list');
      if (!machineIds.length) { el.innerHTML = '<div class="machine-empty">ไม่พบเครื่องในสาขานี้</div>'; return; }
      el.innerHTML = machineIds.map(mId => `
        <div class="machine-item${selected.has(mId) ? ' checked' : ''}" data-id="${esc(mId)}">
          <span class="box">${selected.has(mId) ? '✓' : ''}</span>
          <span>${esc(stripPrefix(mId))}</span>
        </div>`).join('');
    }
    document.getElementById('machine-list').addEventListener('click', e => {
      const item = e.target.closest('.machine-item'); if (!item) return;
      const mId = item.dataset.id;
      if (selected.has(mId)) selected.delete(mId); else selected.add(mId);
      renderMachines();
      renderBranches();
      updateFooter();
    });

    function updateFooter() {
      const btn = document.getElementById('show-btn');
      const sum = document.getElementById('summary');
      if (!selected.size) {
        btn.disabled = true; btn.textContent = 'เลือกเครื่องก่อน';
        sum.textContent = 'ยังไม่ได้เลือกเครื่อง'; return;
      }
      btn.disabled = false; btn.textContent = `แสดงผล (${selected.size} เครื่อง)`;
      sum.textContent = 'เลือกแล้ว: ' + [...selected].map(id => stripPrefixSafe(id)).join(', ');
    }
    function stripPrefixSafe(mId) {
      const bn = machineBranch[mId];
      if (bn && mId.startsWith(bn + '_')) return bn + '/' + mId.slice(bn.length + 1);
      return mId;
    }

    document.getElementById('show-btn').addEventListener('click', async () => {
      if (!selected.size) return;
      const btn = document.getElementById('show-btn');
      btn.disabled = true; btn.textContent = 'กำลังสร้างรายงาน...';
      try {
        const res = await fetch('/api/machine-report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accessToken: liff.getAccessToken(),
            machineIds: [...selected],
            period,
            start: document.getElementById('date-start').value,
            end: document.getElementById('date-end').value
          })
        });
        const data = await res.json();
        if (!res.ok) { document.getElementById('summary').textContent = data.message || 'สร้างรายงานไม่สำเร็จ'; updateFooter(); return; }
        if (liff.isInClient()) liff.closeWindow();
        else document.getElementById('summary').textContent = 'ส่งรายงานเข้าแชทแล้ว เปิด LINE เพื่อดู';
      } catch (e) {
        document.getElementById('summary').textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
      }
      updateFooter();
    });

    init();
  </script>
</body>
</html>
